    <title>My Web Page</title>
    <link rel="stylesheet" href="styles.css">

    <style >
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }
        header {
            background: #333;
            color: #fff;
            padding-top: 30px;
            min-height: 70px;
            border-bottom: #77aaff 3px solid;
        }
        header h1, header h2 {
            text-align: center;
        }
        main {
            padding: 20px;
            background: #fff;
            margin-top: 20px;
        }
        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            margin-top: 20px;
        }
        img {
            display: block;
            margin: 20px auto;
            border-radius: 10px;
            border: 2px solid #ccc;
        }
    </style>
</head>
<body>
